[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "google-flights-search-cli"
version = "0.1.0"
description = "Agent-first CLI for evidence-backed Google Flights search and fixture replay."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
  "typer>=0.12",
]

[project.optional-dependencies]
analysis = [
  "pandas>=2.2",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
]

[project.scripts]
gflights = "gflights.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "live_cdp: opt-in tests that may touch a live browser or Google Flights",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.hatch.build.targets.wheel]
packages = ["src/gflights"]
